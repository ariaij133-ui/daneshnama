name: Change Giscus Comments to Dark Mode

on:
  workflow_dispatch:

jobs:
  change-giscus-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Find Giscus code
        run: |
          echo "===== فایل‌هایی که کد giscus دارند ====="
          grep -l "giscus" *.html || echo "هیچ فایلی پیدا نشد"
          echo ""
          echo "===== تم فعلی giscus ====="
          grep -H "data-theme" *.html || echo "data-theme پیدا نشد"
      
      - name: Change Giscus theme to dark
        run: |
          changed=0
          for file in *.html; do
            if grep -q "giscus" "$file"; then
              # تغییر هر حالت light به dark
              sed -i 's/data-theme="light"/data-theme="dark"/g' "$file"
              sed -i "s/data-theme='light'/data-theme='dark'/g" "$file"
              sed -i 's/data-theme="preferred_color_scheme"/data-theme="dark"/g' "$file"
              sed -i 's/data-theme="noborder_light"/data-theme="noborder_dark"/g' "$file"
              sed -i 's/data-theme="transparent"/data-theme="dark"/g' "$file"
              
              echo "✅ بررسی شد: $file"
              changed=$((changed + 1))
            fi
          done
          echo "تعداد فایل‌های giscus: $changed"
      
      - name: Verify changes
        run: |
          echo "===== تم جدید giscus ====="
          grep -H "data-theme" *.html | grep giscus || grep -H "data-theme" *.html
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Change Giscus comments theme to dark"
          git push
