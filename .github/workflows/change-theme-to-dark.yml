name: Change Comments to Dark Mode

on:
  workflow_dispatch:

jobs:
  change-comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Change comments color to dark
        run: |
          for file in *.html; do
            if [ "$file" != "index.html" ] && [ "$file" != "index-en.html" ]; then
              # تغییر color سفید به تیره فقط در خطوطی که شامل comment هستند
              sed -i '/comment/I s/color:\s*#fff/color: #1a1a1a/gI' "$file"
              sed -i '/comment/I s/color:\s*white/color: #1a1a1a/gI' "$file"
              sed -i '/comment/I s/color:\s*#ffffff/color: #1a1a1a/gI' "$file"
              
              # همچنین برای background اگر کامنت‌ها پس‌زمینه سفید دارند
              sed -i '/comment/I s/background:\s*#fff/background: #1a1a1a/gI' "$file"
              sed -i '/comment/I s/background:\s*white/background: #1a1a1a/gI' "$file"
              
              echo "تغییر کرد: $file"
            fi
          done
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Change comments color to dark mode"
          git push
