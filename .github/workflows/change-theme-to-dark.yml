name: Change Giscus Comments to Dark Mode

on:
  workflow_dispatch:

jobs:
  change-giscus-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Change Giscus theme to dark
        run: |
          for file in *.html; do
            if [ "$file" != "index.html" ] && [ "$file" != "index-en.html" ]; then
              
              # تغییر تم Giscus از light به dark
              sed -i 's/data-theme="light"/data-theme="dark"/g' "$file"
              sed -i "s/data-theme='light'/data-theme='dark'/g" "$file"
              
              # اگر مقدار theme به شکل دیگری بود (مثلاً preferred_color_scheme)
              sed -i 's/data-theme="preferred_color_scheme"/data-theme="dark"/g' "$file"
              
              echo "بررسی شد: $file"
            fi
          done
          
          echo "----- بررسی نتیجه -----"
          grep -l 'data-theme="dark"' *.html || echo "هیچ فایلی تغییر نکرد"
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Change Giscus comments theme to dark"
          git push
