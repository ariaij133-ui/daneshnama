name: Fix Giscus Theme

on:
  workflow_dispatch:

jobs:
  fix-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Change theme from light to dark
        run: |
          find . -name "*.html" -type f -exec sed -i 's/data-theme="light"/data-theme="dark"/g' {} \;
          echo "✅ تم همه مقالات عوض شد"
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Fix Giscus theme to dark"
          git push
