name: Change Theme to Light Mode

on:
  workflow_dispatch:

jobs:
  change-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Change theme to light mode
        run: |
          for file in *.html; do
            if [ "$file" != "index.html" ] && [ "$file" != "index-en.html" ]; then
              
              # فقط تم رو تغییر بده (نه کلمه dark توی متن)
              sed -i "s/data-theme=\"dark\"/data-theme=\"light\"/g" "$file"
              sed -i "s/data-theme='dark'/data-theme='light'/g" "$file"
              
              echo "تغییر کرد: $file"
            fi
          done
      
      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Change theme to light mode"
          git push
