name: Add Ads Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  add-ads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add ads script
        run: |
          for f in *.html; do
            if [ "$f" != "index.html" ] && [ "$f" != "index-en.html" ]; then
              if ! grep -q "ads.js" "$f"; then
                sed -i 's|</head>|<script src="ads.js" defer></script>\n</head>|' "$f"
              fi
            fi
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Add ads script"
          git push
