<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- درخشش پشت سیاره -->
  <circle cx="100" cy="100" r="80" fill="url(#glow)" />

  <!-- مدارها -->
  <ellipse cx="100" cy="100" rx="75" ry="35" fill="none" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(-30 100 100)" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="85" ry="40" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" transform="rotate(20 100 100)" opacity="0.4"/>

  <!-- سیاره -->
  <circle cx="100" cy="100" r="40" fill="url(#planetGrad)" />

  <!-- قاره‌ها (نقاط تیره) -->
  <ellipse cx="88" cy="90" rx="10" ry="7" fill="#0a0a0a" opacity="0.4" />
  <ellipse cx="115" cy="105" rx="8" ry="5" fill="#0a0a0a" opacity="0.3" />
  <ellipse cx="95" cy="115" rx="6" ry="4" fill="#0a0a0a" opacity="0.3" />

  <!-- مدار دور سیاره (حلقه) -->
  <ellipse cx="100" cy="100" rx="55" ry="15" fill="none" stroke="#00ff88" stroke-width="2.5" transform="rotate(-20 100 100)" opacity="0.9"/>

  <!-- ستاره‌های کوچک -->
  <circle cx="30" cy="30" r="2" fill="#00ff88" opacity="0.6" />
  <circle cx="170" cy="50" r="1.5" fill="#00ccff" opacity="0.7" />
  <circle cx="40" cy="170" r="1.5" fill="#00ff88" opacity="0.5" />
  <circle cx="160" cy="160" r="2" fill="#00ccff" opacity="0.6" />
  <circle cx="180" cy="100" r="1" fill="#00ff88" opacity="0.4" />
  <circle cx="20" cy="110" r="1" fill="#00ccff" opacity="0.5" />
</svg>
